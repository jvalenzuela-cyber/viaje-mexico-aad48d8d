<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5e1f3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="México 2026">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>México · Oaxaca · Puerto Escondido · Durango</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#5e1f3d; --sea2:#8e2750; --aegean:#1f8fa0; --turq:#2ab0bf;
    --sand:#f7ecd9; --paper:#fdf7ee; --ink:#2b1a20; --muted:#7a6068;
    --line:rgba(94,31,61,.12); --gold:#e8a33d; --rose:#d4674f; --orbital:#2f9e6e;
    --good:#2f9e6e; --bad:#c8443a; --warn:#d9902c;
    --card:#ffffff; --shadow:0 6px 24px rgba(94,31,61,.10);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    padding-bottom:calc(76px + var(--safe-b));
  }
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif}
  a{color:var(--aegean);text-decoration:none}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(160deg,#5e1f3d,#8e2750);
    color:#fff;padding:calc(12px + var(--safe-t)) 0 12px;
    box-shadow:0 4px 18px rgba(94,31,61,.25);
  }
  .head-inner{padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand .eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#f2bfd0;font-weight:600}
  .brand h1{font-size:17px;margin:2px 0 0;font-weight:600;line-height:1.15}
  .count{
    text-align:right;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    border-radius:14px;padding:6px 12px;min-width:74px;backdrop-filter:blur(4px)
  }
  .count .num{font-family:'Fraunces',serif;font-size:22px;font-weight:700;line-height:1}
  .count .lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#f5d5df}

  /* ---------- Bottom nav ---------- */
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
    background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:7px 4px calc(7px + var(--safe-b));box-shadow:0 -4px 20px rgba(94,31,61,.08)}
  .bnav button{flex:1;border:0;background:none;font-family:inherit;display:flex;flex-direction:column;
    align-items:center;gap:3px;padding:4px 2px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;transition:.15s}
  .bnav button .bi{opacity:.65;transition:.15s;display:grid;place-items:center}
  .bnav button.on{color:var(--aegean)}
  .bnav button.on .bi{opacity:1;transform:translateY(-1px)}

  /* offline bar */
  .offline-bar{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-b));z-index:55;
    background:var(--warn);color:#fff;text-align:center;font-size:12px;font-weight:600;
    padding:7px 12px;transform:translateY(150%);transition:transform .3s;box-shadow:0 -2px 12px rgba(0,0,0,.15)}
  .offline-bar.show{transform:none}

  /* ---------- Layout ---------- */
  main{max-width:680px;margin:0 auto;padding:16px 16px 30px}
  .view{display:none;animation:fade .25s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sec-title{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--aegean);font-weight:700;margin:22px 2px 10px}
  .sec-title:first-child{margin-top:4px}
  .backbar{display:inline-flex;align-items:center;gap:6px;color:var(--aegean);font-weight:600;font-size:13px;padding:2px 0 14px;cursor:pointer}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:12px}
  .card.flat{box-shadow:none}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .pill.ok{background:rgba(47,158,110,.13);color:var(--good)}
  .pill.pend{background:rgba(217,144,44,.15);color:var(--warn)}
  .pill.info{background:rgba(31,143,160,.12);color:var(--aegean)}
  .pill.pay{background:rgba(47,158,110,.13);color:var(--good)}

  /* map button */
  .mapbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--aegean);background:rgba(31,143,160,.1);padding:8px 13px;border-radius:10px;margin-top:11px}

  /* ---------- Hoy ---------- */
  .cd-hero{border-radius:20px;overflow:hidden;position:relative;color:#fff;
    background:linear-gradient(150deg,#5e1f3d 0%,#8e2750 55%,#c4633a 100%);
    padding:22px 20px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center}
  .cd-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(42,176,191,.45),transparent 70%)}
  .cd-hero>*{position:relative}
  .cd-hero .eq{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#f5d5df;font-weight:600}
  .cd-hero .big{font-family:'Fraunces',serif;font-size:60px;font-weight:700;line-height:.95;margin:6px 0 2px}
  .cd-hero .u{font-size:13px;color:#fdeef3;font-weight:500}
  .cd-hero .dts{font-size:12.5px;color:#f5d5df;margin-top:10px}
  .cd-hero .who{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
  .ava{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:5px 11px 5px 5px;border-radius:999px;font-size:12.5px;font-weight:600}
  .ava i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:#3d1026}

  .todayhero{border-radius:20px;overflow:hidden;position:relative;color:#fff;
    background:linear-gradient(150deg,#5e1f3d,#b5365f);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:12px}
  .todayhero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(47,158,110,.35),transparent 70%)}
  .todayhero>*{position:relative}
  .todayhero .dd{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#f5d5df;font-weight:700}
  .todayhero h2{font-family:'Fraunces';font-size:27px;margin:4px 0 0;font-weight:600}
  .todayhero .meta{font-size:12.5px;color:#f9e2ea;margin-top:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .todayhero .meta .chip{background:rgba(255,255,255,.15);border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px}

  .nextup{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid rgba(47,158,110,.4);border-left:4px solid var(--orbital);border-radius:14px;padding:13px 15px;margin-bottom:12px;box-shadow:var(--shadow)}
  .nextup .ni{width:40px;height:40px;border-radius:11px;background:rgba(47,158,110,.14);color:#217a53;display:grid;place-items:center;flex:0 0 auto}
  .nextup .nx{flex:1;min-width:0}
  .nextup .nx .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .nextup .nx b{font-size:15px;display:block;margin-top:1px}
  .nextup .nx span{font-size:12px;color:var(--muted)}

  .prep{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:11px}
  .pcard .pi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
  .pcard .pv{font-family:'Fraunces';font-size:20px;font-weight:700;color:var(--sea);line-height:1}
  .pcard .pk{font-size:11px;color:var(--muted);margin-top:2px}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px;text-align:center;box-shadow:var(--shadow)}
  .stat .v{font-family:'Fraunces',serif;font-size:21px;font-weight:700;color:var(--sea)}
  .stat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:600}

  .budget-hero{background:linear-gradient(135deg,#5e1f3d,#b5365f);color:#fff;border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
  .budget-hero::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(47,158,110,.4),transparent 70%)}
  .budget-hero>*{position:relative}
  .budget-hero .bh-top{display:flex;justify-content:space-between;align-items:center}
  .budget-hero .bh-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#f5d5df;font-weight:600}
  .budget-hero .bh-rate{font-size:10.5px;color:#f5d5df;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:8px;font-weight:600}
  .budget-hero .bh-clp{font-family:'Fraunces',serif;font-size:33px;font-weight:700;line-height:1.05;margin-top:7px}
  .budget-hero .bh-eur{font-size:12.5px;color:#f5d5df;margin-top:3px}
  .budget-hero .bh-pp{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;color:#fdeef3;display:flex;align-items:baseline;gap:7px}
  .budget-hero .bh-pp b{font-family:'Fraunces',serif;font-size:17px}
  .budget-hero .bh-pp .sec{color:#bfe3ec;margin-left:auto;font-size:12px}

  .next li{list-style:none}
  .next ul{margin:0;padding:0}
  .next li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .next li:last-child{border-bottom:0}
  .next .tag{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--rose);padding:3px 8px;border-radius:7px;margin-top:1px}

  /* ---------- Itinerary ---------- */
  .day{margin-bottom:14px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card)}
  .day.istoday{border:1px solid rgba(47,158,110,.55);box-shadow:0 0 0 2px rgba(47,158,110,.18),var(--shadow)}
  .day-head{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;background:linear-gradient(100deg,rgba(31,143,160,.06),transparent)}
  .day-head .date{flex:0 0 auto;text-align:center;background:var(--sea);color:#fff;border-radius:12px;padding:6px 9px;min-width:46px}
  .day.istoday .day-head .date{background:var(--orbital);color:#ffffff}
  .day-head .date .d{font-family:'Fraunces',serif;font-size:18px;font-weight:700;line-height:1}
  .day-head .date .mo{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#bfe3ec}
  .day.istoday .day-head .date .mo{color:#ffffff}
  .day-head .ti{flex:1;min-width:0}
  .day-head .ti b{font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .day-head .ti span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
  .day-head .hicon{display:inline-flex;align-items:center;gap:4px;color:var(--aegean)}
  .day-head .chev{transition:.25s;color:var(--aegean);flex:0 0 auto}
  .day.open .chev{transform:rotate(180deg)}
  .day-body{display:none;padding:4px 15px 14px}
  .day.open .day-body{display:block}
  .slot{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
  .slot .ic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(31,143,160,.1);color:var(--aegean)}
  .slot .tx{flex:1;font-size:13.5px}
  .slot .tx b{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;font-weight:700}
  .slot .tx b.mealk{color:var(--gold)}
  .daynote{margin-top:11px;font-size:12.5px;color:var(--sea2);background:rgba(31,143,160,.07);border-left:3px solid var(--aegean);padding:9px 11px;border-radius:0 10px 10px 0}
  .badge-city{font-size:10px;font-weight:700;letter-spacing:.04em;color:#fff;padding:2px 8px;border-radius:7px}
  .hotelrow{display:flex;align-items:center;gap:10px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:13px}
  .hotelrow .hi{color:var(--aegean)}
  .hotelrow .ha{margin-left:auto}

  /* ---------- Flight / hotel cards ---------- */
  .fcard{position:relative}
  .froute{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .froute .ap{font-family:'Fraunces',serif;font-size:21px;font-weight:700}
  .froute .arr{flex:1;height:1px;background:linear-gradient(90deg,var(--line),var(--aegean),var(--line));position:relative}
  .froute .arr::after{content:"✈";position:absolute;right:-2px;top:-10px;color:var(--aegean);font-size:14px}
  .froute .arr .plus{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-size:10px;color:var(--muted);background:var(--card);padding:0 5px}
  .ftimes{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px}
  .ftimes b{color:var(--ink);font-size:13px}
  .fmeta{display:flex;flex-wrap:wrap;gap:7px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
  .fmeta b{color:var(--ink)}
  .hotel .hh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .hotel .hh h3{margin:0;font-size:17px}
  .hotel .stay{font-size:12px;color:var(--muted);margin-top:3px}
  .hotel .feat{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .feat .t{font-size:11.5px;background:rgba(94,31,61,.05);border:1px solid var(--line);padding:4px 9px;border-radius:8px;color:var(--sea2)}
  .booklink{display:inline-flex;align-items:center;gap:6px;margin-top:11px;margin-right:8px;font-size:13px;font-weight:600;background:rgba(31,143,160,.1);padding:8px 13px;border-radius:10px}

  /* ---------- Money ---------- */
  .balcard{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px}
  .balcard i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-family:'Fraunces',serif;font-size:16px;color:#3d1026;flex:0 0 auto}
  .balcard .nm{flex:1}
  .balcard .nm b{font-size:15px}
  .balcard .nm span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;max-width:32ch}
  .balcard .amt{text-align:right;font-family:'Fraunces',serif;font-weight:700;font-size:16px;white-space:nowrap}
  .amt.owe{color:var(--bad)} .amt.get{color:var(--good)}
  .transfer{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .transfer:last-child{border-bottom:0}
  .transfer .ar{color:var(--aegean);font-weight:700}
  .transfer .tamt{margin-left:auto;font-weight:700;font-family:'Fraunces',serif;color:var(--sea)}
  .bud{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .bud:last-child{border-bottom:0}
  .bud .bic{width:30px;height:30px;border-radius:9px;background:rgba(31,143,160,.1);color:var(--aegean);display:grid;place-items:center;flex:0 0 auto}
  .bud .bn{flex:1;font-size:13.5px}
  .bud .bn span{display:block;font-size:11px;color:var(--muted)}
  .bud .bv{font-weight:700;font-family:'Fraunces',serif;font-size:14.5px;white-space:nowrap}
  .total-bar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,#5e1f3d,#b5365f);color:#fff;border-radius:14px;padding:14px 17px;margin-top:6px}
  .total-bar .tt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#f5d5df}
  .total-bar .tv{font-family:'Fraunces',serif;font-size:24px;font-weight:700}
  .total-bar small{display:block;font-size:11px;color:#bfe3ec;text-transform:none;letter-spacing:0}
  .payitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .payitem:last-child{border-bottom:0}
  .payitem .pc{flex:1}
  .payitem .pc b{font-size:13.5px}
  .payitem .pc span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  .payitem .pv{text-align:right;white-space:nowrap}
  .payitem .pv b{font-family:'Fraunces',serif;font-size:14px}
  .paysum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
  .paysum .bar{height:10px;border-radius:999px;background:rgba(200,68,58,.16);overflow:hidden;margin-bottom:10px}
  .paysum .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#2fb6c4);transition:width .4s}
  .paysum .legend{display:flex;justify-content:space-between;font-size:12.5px}
  .paysum .legend .k{color:var(--muted)}
  .paysum .legend b{font-family:'Fraunces',serif;font-size:15px;display:block;margin-top:1px}
  .paysum .legend .paid b{color:var(--good)} .paysum .legend .pend b{color:var(--bad)}
  .paychk{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .paychk:last-child{border-bottom:0}
  .paychk .box{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:.15s;margin-top:1px;background:#fff}
  .paychk.done .box{background:var(--good);border-color:var(--good)}
  .paychk .box svg{opacity:0;transition:.15s}
  .paychk.done .box svg{opacity:1}
  .paychk .pc{flex:1;min-width:0}
  .paychk .pc b{font-size:13.5px}
  .paychk .pc span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  .paychk .pv{text-align:right;white-space:nowrap;font-family:'Fraunces',serif;font-weight:700;font-size:14px;color:var(--bad)}
  .paychk.done .pv{color:var(--good)}
  /* quién debe a quién (simplificado) */
  .callout{display:flex;gap:11px;align-items:flex-start;background:rgba(47,158,110,.1);border:1px solid rgba(47,158,110,.32);border-radius:14px;padding:13px 15px;margin-bottom:12px;font-size:13.5px;color:var(--sea)}
  .callout .ci{color:#217a53;flex:0 0 auto;margin-top:1px}
  .settle{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:10px}
  .settle .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:'Fraunces';font-size:14px;color:#3d1026;flex:0 0 auto}
  .settle .ar{color:var(--muted);flex:0 0 auto;display:grid;place-items:center}
  .settle .slbl{flex:1;min-width:0;font-size:13.5px;margin-left:3px}
  .settle .samt{font-family:'Fraunces';font-weight:700;font-size:18px;color:var(--sea);white-space:nowrap}
  .detail{margin-top:4px}
  .detail-h{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--aegean);font-weight:600;font-size:13px;padding:6px 2px}
  .detail-h .chev{transition:.25s}
  .detail.open .detail-h .chev{transform:rotate(180deg)}
  .detail-b{display:none;margin-top:8px}
  .detail.open .detail-b{display:block}

  /* ---------- Food ---------- */
  .meal{margin-bottom:12px}
  .meal .mh{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .meal .mh .md{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--sea)}
  .meal .mh .mc{font-size:11px;color:var(--muted)}
  .meal .row{display:flex;gap:10px;padding:7px 0;font-size:13px;border-top:1px solid var(--line)}
  .meal .row .lab{flex:0 0 58px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--aegean);padding-top:2px}
  .dish{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .dish:last-child{border-bottom:0}
  .dish b{display:block;font-size:13.5px}
  .dish span{display:block;font-size:12.5px;color:var(--muted)}
  .dish .wheretoeat{display:inline-flex}
  .wheretoeat{display:inline-flex;align-items:flex-start;gap:5px;margin-top:7px;font-size:12px;font-weight:600;color:var(--aegean);line-height:1.35;background:rgba(31,143,160,.08);padding:6px 10px;border-radius:9px}
  .wheretoeat svg{flex:0 0 auto;margin-top:1px}

  /* ---------- Lists (check) ---------- */
  .progress{height:8px;border-radius:999px;background:rgba(94,31,61,.1);overflow:hidden;margin:6px 0 14px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--good));transition:.4s}
  .chk{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .chk:last-child{border-bottom:0}
  .chk .box{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:.15s;margin-top:1px;background:#fff}
  .chk.done .box{background:var(--good);border-color:var(--good)}
  .chk .box svg{opacity:0;transition:.15s}
  .chk.done .box svg{opacity:1}
  .chk .ct{flex:1;font-size:14px}
  .chk .ct span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

  .chk .cat{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--aegean);background:rgba(31,143,160,.1);padding:2px 7px;border-radius:6px;flex:0 0 auto;margin-top:2px}
  .reset{display:block;margin:14px auto 0;background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:12px;padding:7px 16px;border-radius:999px;cursor:pointer}

  /* ---------- Info ---------- */
  .note{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .note:last-child{border-bottom:0}
  .note .ni{flex:0 0 auto;color:var(--aegean);margin-top:1px}
  .contact{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .contact:last-child{border-bottom:0}
  .contact .ci{width:38px;height:38px;border-radius:11px;background:rgba(31,143,160,.1);color:var(--aegean);display:grid;place-items:center;flex:0 0 auto}
  .contact .cd{flex:1;min-width:0}
  .contact .cd b{font-size:13.5px}
  .contact .cd span{display:block;font-size:11.5px;color:var(--muted)}
  .contact .cact{display:flex;gap:8px}
  .contact .cact a{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sea);color:#fff}
  .ferry{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .ferry:last-child{border-bottom:0}
  .ferry b{flex:1}
  .ferry .fp{font-weight:700;font-family:'Fraunces',serif;color:var(--sea)}
  .ferry .ft{font-size:11.5px;color:var(--muted)}
  .act{padding:10px 0;border-bottom:1px solid var(--line)}
  .act:last-child{border-bottom:0}
  .act b{font-size:14px}
  .act p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .climate{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .climate:last-child{border-bottom:0}
  .climate .cdot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
  .climate .cc{flex:1}
  .climate .cc b{font-size:13.5px}
  .climate .cc span{display:block;font-size:11.5px;color:var(--muted)}
  .climate .ct{font-family:'Fraunces';font-weight:700;color:var(--sea);white-space:nowrap}

  .dayroute{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}

  .extra .xc p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

  .mtile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;font-family:inherit}

  .thumb,.rcard .cover{background:linear-gradient(100deg,rgba(94,31,61,.05),rgba(94,31,61,.11),rgba(94,31,61,.05));background-size:200% 100%;animation:shimmer 1.4s infinite linear}

  .thumb{flex:0 0 auto;width:74px;height:74px;border-radius:12px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}

  .exitem .pc span{font-size:11.5px;color:var(--muted)}

  .whosel{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}

  .bodaday .ti b{font-size:14px}

  .footer{text-align:center;font-size:11px;color:var(--muted);margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}

const dirUrl = (pts, mode) => {
  if(!pts || pts.length<2) return null;
  const enc = s => encodeURIComponent(s);
  const origin=enc(pts[0].q), dest=enc(pts[pts.length-1].q);
  const mid=pts.slice(1,-1).map(p=>enc(p.q)).join('|');
  let u=`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=${mode||'walking'}`;
  if(mid) u+=`&waypoints=${mid}`;
  return u;
};

/* dates (with ?d=YYYY-MM-DD override for testing) */
function parseDM(dm){ const [d,m]=dm.split('/').map(Number); return new Date(2026, m-1, d); }
function todayDate(){ const p=new URLSearchParams(location.search).get('d'); const t=p?new Date(p+'T09:00:00'):new Date(); t.setHours(0,0,0,0); return t; }
function tripDayIndex(){ const tm=todayDate().getTime(); return ITIN.findIndex(d=>parseDM(d.date).getTime()===tm); }
function daysToStart(){ return Math.round((parseDM(ITIN[0].date)-todayDate())/86400000); }
const flightByDate = {}; FLIGHTS.forEach(f=>{ (flightByDate[f.date]=flightByDate[f.date]||[]).push(f); });
const hotelByName = {}; HOTELS.forEach(h=>hotelByName[h.name]=h);
const monName = mm => ['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][parseInt(mm)];

/* check counters for Hoy */
function checkCount(items,key,hasDefaults){
  const st=loadState(key); let done=0;
  items.forEach((it,i)=>{ const id=key+'_'+i; const c=(id in st)?st[id]:(hasDefaults?!!it.done:false); if(c)done++; });
  return {done,total:items.length,pending:items.length-done};
}
function pendingPay(){
  const st=loadState('mx_pagos'); let pend=0;
  PAYMENTS.forEach((p,i)=>{ const id='mx_pagos_'+i; const paid=(id in st)?st[id]:(p.st==='Pagado'); if(!paid) pend+=p.val; });
  return pend;
}

/* ============== COUNTDOWN ============== */
function countdown(){
  const dep=parseDM(ITIN[0].date), now=todayDate();
  const back=parseDM(ITIN[ITIN.length-1].date);
  const diff=Math.round((dep-now)/86400000);
  const num=$('#cdNum'), lbl=$('#cdLbl'), pre=$('#cdPre');
  const setPre = t => { pre.textContent=t; pre.style.display=t?'block':'none'; };
  if(now>=dep && now<=back){ setPre(''); num.textContent='✈'; num.style.fontSize='22px'; lbl.textContent='¡en ruta!'; }
  else if(diff>0){ setPre('faltan'); num.textContent=diff; lbl.textContent=diff===1?'día':'días'; }
  else if(diff===0){ setPre(''); num.textContent='¡Hoy!'; num.style.fontSize='15px'; lbl.textContent='salida'; }
  else { setPre(''); num.textContent='♥'; lbl.textContent='vuelta'; }
}

function renderHoy(){
  const v=$('#v-hoy'); v.innerHTML='';
  const idx=tripDayIndex();
  const before = todayDate() < parseDM(ITIN[0].date);
  const after = todayDate() > parseDM(ITIN[ITIN.length-1].date);

  if(idx>=0){ renderHoyTrip(v, idx); }
  else if(before){ renderHoyBefore(v); }
  else { renderHoyAfter(v); }
}

    <h2>${CITY[d.city].n}</h2>
    <div class="meta"><span class="chip">${d.dow} ${dd} ${monName(mm)}</span>
      ${cl?`<span class="chip">${cl.ic} ${cl.t}</span>`:''}${d.tag?`<span class="chip">${d.tag}</span>`:''}</div>`;
  v.appendChild(hero);

  // siguiente / destacado
  const fl=(flightByDate[d.date]||[])[0];
  let nx;
  if(fl){ nx={k:'Vuelo de hoy',b:`${fl.dep} · ${fl.from} → ${fl.to}`,s:`${fl.airline} · loc. ${fl.loc}`,ic:I.plane}; }

                         : ['Por la noche', d.e, I.moon];
    nx={k, b, s:d.tr?('Transporte: '+d.tr):('Alojamiento: '+d.hotel), ic};
  }
  else {
    const dp=DAY_PLACES[d.date];
    nx = dp ? {k:'Ideas para hoy',b:dp.pts.map(p=>p.n).join(' · '),s:'Sin plan escrito: toca abajo para abrir el mapa',ic:I.pin}
            : {k:'Hoy',b:'Día libre en '+CITY[d.city].n,s:'Alojamiento: '+d.hotel,ic:I.sun};
  }
  const nu=el('div','nextup');
  nu.innerHTML=`<div class="ni">${nx.ic}</div><div class="nx"><div class="k">${nx.k}</div><b>${nx.b}</b><span>${nx.s}</span></div>`;
  v.appendChild(nu);

  // plan del día
  v.appendChild(el('div','sec-title','El plan de hoy'));
  v.appendChild(dayBody(d, true));

  // mañana
  if(idx+1<ITIN.length){
    const t=ITIN[idx+1];
    v.appendChild(el('div','sec-title','Mañana'));

/* ============== DINERO ============== */
/* Todo el dinero se calcula aquí, en el momento, a partir de:
   - PAYMENTS (lo que viene de la hoja de planificación)
   - lo que se marca como pagado en este móvil (mx_pagos)
   - quién puso cada pago (mx_pagador), editable desde la app
   - los gastos que se van añadiendo sobre la marcha (mx_gastos)
   Regla: el viaje se reparte a medias salvo que un gasto se marque de uno solo. */
const PAYKEY='mx_pagos', WHOKEY='mx_pagador', EXPKEY='mx_gastos';
const YO=['Javiera','Juan'];
const PCOLOR={Javiera:'#1f8fa0', Juan:'#c4633a'};

function loadExpenses(){ try{ return JSON.parse(localStorage.getItem(EXPKEY))||[]; }catch(e){ return []; } }
function saveExpenses(a){ localStorage.setItem(EXPKEY, JSON.stringify(a)); }
/* formato español a mano: toLocaleString no siempre agrupa los miles según el
   navegador, y quedaban importes como "5707,84 €" en vez de "5.707,84 €" */
const eurN = v => {
  const neg = v<0; const [ent,dec] = Math.abs(v).toFixed(2).split('.');
  return (neg?'-':'') + ent.replace(/\B(?=(\d{3})+(?!\d))/g,'.') + ',' + dec + ' €';
};

function moneyState(){
  const paidSt=loadState(PAYKEY), whoSt=loadState(WHOKEY);
  const isPaid=(p,i)=> (PAYKEY+'_'+i in paidSt) ? paidSt[PAYKEY+'_'+i] : (p.st==='Pagado');
  const payer =(p,i)=> (WHOKEY+'_'+i in whoSt)  ? whoSt[WHOKEY+'_'+i]  : (YO.includes(p.by)?p.by:'');

  const put={Javiera:0,Juan:0};       // lo que cada uno ha desembolsado
  const oweAll={Javiera:0,Juan:0};    // su parte de todo el viaje (lo pagado sin dueño no se reparte: ya está pagado)
  const owePaid={Javiera:0,Juan:0};   // su parte de lo pagado Y con dueño conocido: sirve para liquidar hoy
  let paid=0, pend=0, unassigned=0;

  // reparte un importe entre los dos segun a quien corresponda el gasto
  const share=(acc,val,split)=>{
    if(split==='medias'||!YO.includes(split)){ acc.Javiera+=val/2; acc.Juan+=val/2; }
    else acc[split]+=val;
  };

  PAYMENTS.forEach((p,i)=>{
    const done=isPaid(p,i), by=done?payer(p,i):'';
    if(done){
      paid+=p.val;
      if(YO.includes(by)){ put[by]+=p.val; share(oweAll,p.val,'medias'); share(owePaid,p.val,'medias'); }
      else unassigned+=p.val;          // pagado, pero no se sabe quien: fuera del reparto hasta asignarlo
    } else {
      pend+=p.val;
      share(oweAll,p.val,'medias');
    }
  });

  const exps=loadExpenses();
  exps.forEach(e=>{
    paid+=e.eur;
    if(YO.includes(e.by)){ put[e.by]+=e.eur; share(oweAll,e.eur,e.split); share(owePaid,e.eur,e.split); }
    else unassigned+=e.eur;
  });

  const total=paid+pend;
  const rows=YO.map(n=>({
    name:n, put:put[n], owe:oweAll[n],
    falta: oweAll[n]-put[n],      // lo que le queda por poner hasta el final del viaje
    saldo: owePaid[n]-put[n]      // si liquidaran hoy: positivo = debe, negativo = le deben
  }));
  return {isPaid, payer, paid, pend, total, unassigned, rows, exps};
}

function settleMoves(rows){
  const cred=rows.filter(r=>r.saldo<-0.005).map(r=>({name:r.name,amt:-r.saldo}));
  const deb =rows.filter(r=>r.saldo> 0.005).map(r=>({name:r.name,amt: r.saldo}));
  const res=[]; let i=0,j=0;
  while(i<deb.length && j<cred.length){
    const m=Math.min(deb[i].amt,cred[j].amt);
    if(m>0.005) res.push({from:deb[i].name,to:cred[j].name,amt:Math.round(m*100)/100});
    deb[i].amt-=m; cred[j].amt-=m;
    if(deb[i].amt<0.005)i++; if(cred[j].amt<0.005)j++;
  }
  return res;
}

function renderMoney(){
  const v=$('#v-dinero'); v.innerHTML='';
  const M=moneyState();

  /* ---- 1. cuánto llevamos ---- */
  v.appendChild(el('div','sec-title','Cómo va el dinero'));
  const tb=el('div','total-bar');
  tb.innerHTML=`<div><div class="tt">Total del viaje</div><small>2 personas · 20 noches</small></div>
    <div style="text-align:right"><div class="tv">${eurN(M.total)}</div><small>${eurN(M.total/2)} por persona</small></div>`;
  v.appendChild(tb);
  const pb=el('div','paysum');
  pb.innerHTML=`<div class="bar"><i style="width:${M.total?(M.paid/M.total*100):0}%"></i></div>
    <div class="legend"><span class="paid"><span class="k">Ya pagado</span><b>${eurN(M.paid)}</b></span>
    <span class="pend" style="text-align:right"><span class="k">Queda por pagar</span><b>${eurN(M.pend)}</b></span></div>`;
  v.appendChild(pb);

  if(M.unassigned>0.005){
    v.appendChild(el('div','callout warn',
      `<span class="ci">${I.info}</span><div>Hay <b>${eurN(M.unassigned)}</b> ya pagados sin saber quién los puso.
       Asígnalos en <b>Estado de pagos</b>, abajo, y el reparto se recalcula solo.</div>`));
  }

  /* ---- 2. lo que queda, repartido para que salga equitativo ---- */
  v.appendChild(el('div','sec-title','Lo que queda por pagar, repartido'));
  v.appendChild(el('div','sub','Cada uno paga esta parte de lo que falta y al final del viaje quedan a la par, sin transferencias.'));
  const split=el('div','card flat');
  let algoNegativo=false;
  M.rows.forEach(r=>{
    const falta=Math.max(0, r.falta);
    if(r.falta<-0.005) algoNegativo=true;
    split.appendChild(el('div','putrow',
      `<i class="av" style="background:${PCOLOR[r.name]}">${r.name[0]}</i>
       <div class="pr"><b>${r.name}</b><span>Ya ha puesto ${eurN(r.put)} · su parte del viaje son ${eurN(r.owe)}</span></div>
       <div class="pamt">${eurN(falta)}<div class="pk">le toca poner</div></div>`));
  });
  v.appendChild(split);
  if(algoNegativo){
    v.appendChild(el('div','sub','Alguien ya ha puesto más de lo que le corresponde en todo el viaje: aunque no pague nada más, el otro tendrá que devolverle la diferencia (abajo).'));
  }

  /* ---- 3. quién paga a quién ---- */
  const moves=settleMoves(M.rows);
  v.appendChild(el('div','sec-title','Quién debe a quién, ahora mismo'));
  if(!moves.length){
    v.appendChild(el('div','callout',`<span class="ci">${I.check}</span><div>Están a la par con lo pagado hasta ahora.</div>`));
  } else {
    v.appendChild(el('div','sub','Si liquidaran hoy, solo con lo que ya está pagado.'));
    moves.forEach(m=>v.appendChild(el('div','settle',
      `<i class="av" style="background:${PCOLOR[m.from]||'#7a6068'}">${m.from[0]}</i>
       <span class="ar">${I.chevR}</span>
       <i class="av" style="background:${PCOLOR[m.to]||'#7a6068'}">${m.to[0]}</i>
       <div class="slbl"><b>${m.from}</b> le debe a <b>${m.to}</b></div>
       <div class="samt">${eurN(m.amt)}</div>`)));
  }

  /* ---- 4. gastos sobre la marcha ---- */
  v.appendChild(el('div','sec-title','Gastos del viaje'));
  v.appendChild(el('div','sub','Apunta aquí lo que vayan gastando allí. Se guarda en este móvil: para que el otro lo vea, usa Compartir.'));

  const form=el('div','card expform');
  form.innerHTML=`
    <input class="ex-c" type="text" placeholder="Concepto (comida, taxi, entradas...)">
    <div class="exrow">
      <input class="ex-a" type="number" inputmode="decimal" placeholder="0,00">
      <div class="seg small ex-cur"><button data-c="MXN" class="on">MXN</button><button data-c="EUR">EUR</button></div>
    </div>
    <div class="exlbl">Quién pagó</div>
    <div class="seg ex-by"><button data-b="Javiera" class="on">Javiera</button><button data-b="Juan">Juan</button></div>
    <div class="exlbl">De quién es el gasto</div>
    <div class="seg ex-sp"><button data-s="medias" class="on">A medias</button><button data-s="Javiera">Solo Javiera</button><button data-s="Juan">Solo Juan</button></div>
    <button class="exadd">Añadir gasto</button>`;
  v.appendChild(form);
  const segPick=(sel,attr)=>{
    const box=form.querySelector(sel);
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    });
    return ()=>box.querySelector('button.on').dataset[attr];
  };
  const getCur=segPick('.ex-cur','c'), getBy=segPick('.ex-by','b'), getSp=segPick('.ex-sp','s');
  form.querySelector('.exadd').onclick=()=>{
    const c=form.querySelector('.ex-c').value.trim();
    const a=parseFloat((form.querySelector('.ex-a').value||'').replace(',','.'));
    if(!c || !a || a<=0){ form.querySelector('.ex-c').focus(); return; }
    const cur=getCur();
    const rate=TOTALS.rate_val||20.1;
    const eurVal=Math.round((cur==='MXN'? a/rate : a)*100)/100;
    const exps=loadExpenses();
    exps.push({id:Date.now(), c, amt:a, cur, eur:eurVal, by:getBy(), split:getSp(),
               d:new Date().toISOString().slice(0,10)});
    saveExpenses(exps);
    renderMoney(); renderHoy();
  };

  const exps=M.exps;
  if(exps.length){
    const lc=el('div','card flat');
    exps.slice().reverse().forEach(e=>{
      const row=el('div','exitem');
      const dd=e.d?e.d.slice(8,10)+'/'+e.d.slice(5,7):'';
      const spl=e.split==='medias'?'a medias':'solo '+e.split;
      row.innerHTML=`<div class="pc"><b>${e.c}</b><span>${dd} · pagó ${e.by} · ${spl}</span></div>
        <div class="pv">${eurN(e.eur)}${e.cur==='MXN'?`<div class="sub2">${e.amt.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')} MXN</div>`:''}</div>
        <button class="exdel" title="Borrar">×</button>`;
      row.querySelector('.exdel').onclick=()=>{
        saveExpenses(loadExpenses().filter(x=>x.id!==e.id));
        renderMoney(); renderHoy();
      };
      lc.appendChild(row);
    });
    v.appendChild(lc);

    const acts=el('div','exacts');
    acts.innerHTML=`<button class="exbtn share">Compartir resumen</button>
                    <button class="exbtn copy">Copiar datos</button>
                    <button class="exbtn paste">Pegar datos</button>`;
    v.appendChild(acts);
    acts.querySelector('.share').onclick=()=>{
      const lines=exps.map(e=>`· ${e.c}: ${eurN(e.eur)} (pagó ${e.by}${e.split!=='medias'?', solo '+e.split:''})`);
      const mv=settleMoves(M.rows).map(m=>`${m.from} le debe a ${m.to}: ${eurN(m.amt)}`).join(' · ')||'están a la par';
      const txt=`Gastos del viaje a México\n${lines.join('\n')}\n\nTotal apuntado: ${eurN(exps.reduce((s,e)=>s+e.eur,0))}\n${mv}`;
      if(navigator.share) navigator.share({text:txt}).catch(()=>{});
      else { navigator.clipboard.writeText(txt); alert('Resumen copiado.'); }
    };
    acts.querySelector('.copy').onclick=()=>{
      navigator.clipboard.writeText(JSON.stringify(exps));
      alert('Datos copiados. Pégalos en el otro móvil con "Pegar datos".');
    };
    acts.querySelector('.paste').onclick=async()=>{
      const txt=prompt('Pega aquí los datos copiados del otro móvil:');
      if(!txt) return;
      try{
        const inc=JSON.parse(txt);
        if(!Array.isArray(inc)) throw 0;
        const mine=loadExpenses(), ids=new Set(mine.map(x=>x.id));
        inc.forEach(x=>{ if(!ids.has(x.id)) mine.push(x); });
        saveExpenses(mine); renderMoney(); renderHoy();
      }catch(e){ alert('Esos datos no se entienden. Copia otra vez desde el otro móvil.'); }
    };
  }

  /* ---- 5. presupuesto previsto ---- */
  v.appendChild(el('div','sec-title','Presupuesto previsto'));
  v.appendChild(el('div','sub','Lo que estimaron en la hoja, categoría a categoría.'));
  const bc=el('div','card');
  BUDGET.forEach(b=>bc.appendChild(el('div','bud',
    `<div class="bic">${b.ic}</div><div class="bn">${b.cat}<span>${b.n}</span></div>
     <div class="bv">${b.v}${b.real&&b.real!=='—'?`<div class="breal">real ${b.real}</div>`:''}</div>`)));
  v.appendChild(bc);

  /* ---- 6. estado de pagos, con quién puso cada uno ---- */
  v.appendChild(el('div','sec-title','Estado de pagos'));
  v.appendChild(el('div','sub','Marca lo que ya esté pagado y di quién lo puso. Se guarda en este móvil.'));
  const paidSt=loadState(PAYKEY), whoSt=loadState(WHOKEY);
  const pc=el('div','card flat');
  PAYMENTS.forEach((p,i)=>{
    const done=M.isPaid(p,i), by=M.payer(p,i);
    const row=el('div','paychk'+(done?' done':''));
    row.innerHTML=`<div class="box">${checkSVG}</div>
      <div class="pc"><b>${p.c}</b><span>${p.n||''}</span>
        <div class="whosel">${YO.map(n=>`<button data-w="${n}" class="${by===n?'on':''}">${n}</button>`).join('')}
          <button data-w="" class="${by?'':'on'}">sin asignar</button></div>
      </div>
      <div class="pv">${p.amt}</div>`;
    row.querySelector('.box').onclick=()=>{
      const now=!row.classList.contains('done');
      paidSt[PAYKEY+'_'+i]=now; saveState(PAYKEY,paidSt);
      renderMoney(); renderHoy();
    };
    row.querySelectorAll('.whosel button').forEach(b=>b.onclick=(ev)=>{
      ev.stopPropagation();
      whoSt[WHOKEY+'_'+i]=b.dataset.w; saveState(WHOKEY,whoSt);
      renderMoney();
    });

/* ============== LISTAS ============== */
function renderCheckList(view, items, key, hasDefaults){
  const state=loadState(key);
  const wrap=el('div','card flat');
  const bar=el('div','progress'); const fill=el('i'); bar.appendChild(fill);
  const counter=el('div','sub');
  function update(){
    let done=0;
    items.forEach((it,i)=>{ const id=key+'_'+i; if((id in state)?state[id]:(hasDefaults?!!it.done:false)) done++; });
    const pct=Math.round(done/items.length*100); fill.style.width=pct+'%';
    counter.textContent=`${done} de ${items.length} · ${pct}%`;
  }
  items.forEach((it,i)=>{
    const id=key+'_'+i;
    const checked=(id in state)?state[id]:(hasDefaults?!!it.done:false);
    const row=el('div','chk'+(checked?' done':''));
    row.innerHTML=`<div class="box">${checkSVG}</div>
      <div class="ct"><b>${it.t}</b>${it.n?`<span>${it.n}</span>`:''}</div>
      <span class="cat">${it.cat}</span>`;
    row.onclick=()=>{ const now=!row.classList.contains('done'); row.classList.toggle('done',now); state[id]=now; saveState(key,state); update(); renderHoy(); };
    wrap.appendChild(row);
  });
  view.appendChild(bar); view.appendChild(counter); view.appendChild(wrap);
  const reset=el('button','reset','Reiniciar esta lista');
  reset.onclick=()=>{ if(confirm('¿Reiniciar las marcas de esta lista?')){localStorage.removeItem(key);renderListas();renderHoy();} };
  view.appendChild(reset); update();
}

/* ============== CONVERSOR ============== */
function renderConversor(){
  const v=$('#v-conversor'); v.innerHTML=backbar('mas');
  v.appendChild(el('div','sec-title','Conversor de moneda'));
  const RKEY='mx_rates';
  const rates=Object.assign({MXN:(TOTALS.rate_val||20.1), CLP:1044}, loadState(RKEY)); // por 1 €
  let from='MXN', amount=100;
  const conv=el('div','conv');
  conv.innerHTML=`
    <div class="seg">
      <button data-c="MXN">Peso $</button><button data-c="EUR">EUR €</button><button data-c="CLP">CLP $</button>
    </div>
    <input class="amt-in" type="number" inputmode="decimal" value="100">
    <div class="out"></div>`;
  v.appendChild(conv);
  const out=conv.querySelector('.out');
  const inp=conv.querySelector('.amt-in');
  const per={EUR:1, MXN:rates.MXN, CLP:rates.CLP};
  function fmt(c,val){
    if(c==='CLP') return '$'+Math.round(val).toLocaleString('es-CL')+' CLP';
    if(c==='MXN') return '$'+Math.round(val).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' MXN';
    return val.toLocaleString('es-ES',{maximumFractionDigits:2})+' €';
  }
  function calc(){
    per.MXN=rates.MXN; per.CLP=rates.CLP;
    const eurVal=(amount||0)/per[from];
    const others=['MXN','EUR','CLP'].filter(c=>c!==from);
    out.innerHTML=others.map(c=>`<div class="orow"><span class="ol">${({EUR:'Euro',MXN:'Peso mexicano',CLP:'Peso chileno'})[c]}</span><span class="ov">${fmt(c,eurVal*per[c])}</span></div>`).join('');
  }
  conv.querySelectorAll('.seg button').forEach(b=>{
    if(b.dataset.c===from) b.classList.add('on');
    b.onclick=()=>{ from=b.dataset.c; conv.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b)); calc(); };
  });
  inp.oninput=()=>{ amount=parseFloat(inp.value); calc(); };
  calc();

  v.appendChild(el('div','sec-title','Tipos de cambio'));
  v.appendChild(el('div','sub','El de la hoja es de junio de 2026: edítalo con el real antes de viajar. Se guarda en este móvil.'));
  const rc=el('div','card rates');
  rc.innerHTML=`
    <label>1 € = <span style="margin-left:auto"></span><input id="rMXN" type="number" inputmode="decimal" value="${rates.MXN}"> $ (MXN)</label>
    <label>1 € = <span style="margin-left:auto"></span><input id="rCLP" type="number" inputmode="decimal" value="${rates.CLP}"> $ (CLP)</label>`;
  v.appendChild(rc);
  const persist=()=>saveState(RKEY,{MXN:rates.MXN,CLP:rates.CLP});
  rc.querySelector('#rMXN').oninput=e=>{ rates.MXN=parseFloat(e.target.value)||rates.MXN; persist(); calc(); };
  rc.querySelector('#rCLP').oninput=e=>{ rates.CLP=parseFloat(e.target.value)||rates.CLP; persist(); calc(); };
}
