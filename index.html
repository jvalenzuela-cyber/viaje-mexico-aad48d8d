<title>México · Oaxaca · Puerto Escondido · Durango</title>

<style>
  /* Fuentes guardadas en la propia app: con Google Fonts, la primera vez sin
     conexión la app cambiaba de cara. Son las dos variables, un archivo cada una. */
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:500 700;font-display:swap;
    src:url(fonts/fraunces.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 700;font-display:swap;
    src:url(fonts/inter.woff2) format('woff2')}
  :root{
    --sea:#5e1f3d; --sea2:#8e2750; --aegean:#1f8fa0; --turq:#2ab0bf;
    --sand:#f7ecd9; --paper:#fdf7ee; --ink:#2b1a20; --muted:#6b525a;
    --line:rgba(94,31,61,.12); --gold:#e8a33d; --rose:#d4674f; --orbital:#2f9e6e;
    --good:#2f9e6e; --bad:#c8443a; --warn:#d9902c;
    --card:#ffffff; --shadow:0 6px 24px rgba(94,31,61,.10);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    padding-bottom:calc(76px + var(--safe-b));
  }
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif}
  a{color:var(--aegean);text-decoration:none}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(160deg,#5e1f3d,#8e2750);
    color:#fff;padding:calc(12px + var(--safe-t)) 0 12px;
    box-shadow:0 4px 18px rgba(94,31,61,.25);
  }
  .head-inner{padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand .eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:#f2bfd0;font-weight:600}
  .brand h1{font-size:17px;margin:2px 0 0;font-weight:600;line-height:1.15}
  .count{
    text-align:right;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    border-radius:14px;padding:6px 12px;min-width:74px;backdrop-filter:blur(4px)
  }
  .count .num{font-family:'Fraunces',serif;font-size:22px;font-weight:700;line-height:1}
  .count .lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#f5d5df}

  /* ---------- Bottom nav ---------- */
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
    background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:7px 4px calc(7px + var(--safe-b));box-shadow:0 -4px 20px rgba(94,31,61,.08)}
  .bnav button{flex:1;border:0;background:none;font-family:inherit;display:flex;flex-direction:column;
    align-items:center;gap:3px;padding:4px 2px;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;transition:.15s}
  .bnav button .bi{opacity:.65;transition:.15s;display:grid;place-items:center}
  .bnav button.on{color:var(--aegean)}
  .bnav button.on .bi{opacity:1;transform:translateY(-1px)}

  /* offline bar */
  .offline-bar{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-b));z-index:55;
    background:var(--warn);color:#fff;text-align:center;font-size:12.5px;font-weight:600;
    padding:7px 12px;transform:translateY(150%);transition:transform .3s;box-shadow:0 -2px 12px rgba(0,0,0,.15)}
  .offline-bar.show{transform:none}
  .update-bar{position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-b));z-index:56;
    background:var(--sea);color:#fff;text-align:center;font-size:13px;font-weight:600;
    padding:10px 12px;transform:translateY(150%);transition:transform .3s;box-shadow:0 -2px 12px rgba(0,0,0,.2)}
  .update-bar.show{transform:none}
  .update-bar button{margin-left:10px;font-family:inherit;font-size:12.5px;font-weight:700;
    padding:6px 14px;border-radius:999px;border:0;background:var(--orbital);color:#06341f;cursor:pointer}

  /* ---------- Layout ---------- */
  main{max-width:680px;margin:0 auto;padding:16px 16px 30px}
  .view{display:none;animation:fade .25s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sec-title{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--aegean);font-weight:700;margin:22px 2px 10px}
  .sec-title:first-child{margin-top:4px}
  .backbar{display:inline-flex;align-items:center;gap:6px;color:var(--aegean);font-weight:600;font-size:13px;padding:2px 0 14px;cursor:pointer}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:12px}
  .card.flat{box-shadow:none}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .pill.ok{background:rgba(47,158,110,.13);color:var(--good)}
  .pill.pend{background:rgba(217,144,44,.15);color:var(--warn)}
  .pill.info{background:rgba(31,143,160,.12);color:var(--aegean)}
  .pill.pay{background:rgba(47,158,110,.13);color:var(--good)}

  /* map button */
  .mapbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--aegean);background:rgba(31,143,160,.1);padding:8px 13px;border-radius:10px;margin-top:11px}

  /* ---------- Hoy ---------- */
  .cd-hero{border-radius:20px;overflow:hidden;position:relative;color:#fff;
    background-image:linear-gradient(180deg,rgba(43,26,32,.34) 0%,rgba(94,31,61,.40) 42%,rgba(94,31,61,.80) 100%),url("img/portada.jpg");
    background-size:cover,cover; background-position:center,center 58%;
    padding:26px 20px 22px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center}
  .cd-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(42,176,191,.3),transparent 70%)}
  .cd-hero .big,.cd-hero .u,.cd-hero .eq,.cd-hero .dts{text-shadow:0 2px 16px rgba(43,26,32,.85),0 1px 4px rgba(43,26,32,.6)}
  .cd-hero>*{position:relative}
  .cd-hero .eq{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#f5d5df;font-weight:600}
  .cd-hero .big{font-family:'Fraunces',serif;font-size:60px;font-weight:700;line-height:.95;margin:6px 0 2px}
  .cd-hero .u{font-size:13px;color:#fdeef3;font-weight:500}
  .cd-hero .dts{font-size:12.5px;color:#f5d5df;margin-top:10px}
  .cd-hero .who{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
  .ava{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:5px 11px 5px 5px;border-radius:999px;font-size:12.5px;font-weight:600}
  .ava i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:#3d1026}

  .todayhero{border-radius:20px;overflow:hidden;position:relative;color:#fff;
    background:linear-gradient(150deg,#5e1f3d,#b5365f);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:12px}
  .todayhero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(47,158,110,.35),transparent 70%)}
  .todayhero>*{position:relative}
  .todayhero .dd{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#f5d5df;font-weight:700}
  .todayhero h2{font-family:'Fraunces';font-size:27px;margin:4px 0 0;font-weight:600}
  .todayhero .meta{font-size:12.5px;color:#f9e2ea;margin-top:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .todayhero .meta .chip{background:rgba(255,255,255,.15);border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px}

  .nextup{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid rgba(47,158,110,.4);border-left:4px solid var(--orbital);border-radius:14px;padding:13px 15px;margin-bottom:12px;box-shadow:var(--shadow)}
  .nextup .ni{width:40px;height:40px;border-radius:11px;background:rgba(47,158,110,.14);color:#217a53;display:grid;place-items:center;flex:0 0 auto}
  .nextup .nx{flex:1;min-width:0}
  .nextup .nx .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .nextup .nx b{font-size:15px;display:block;margin-top:1px}
  .nextup .nx span{font-size:12.5px;color:var(--muted)}

  .prep{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:11px}
  .pcard .pi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
  .pcard .pv{font-family:'Fraunces';font-size:20px;font-weight:700;color:var(--sea);line-height:1}
  .pcard .pk{font-size:12px;color:var(--muted);margin-top:2px}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px;text-align:center;box-shadow:var(--shadow)}
  .stat .v{font-family:'Fraunces',serif;font-size:21px;font-weight:700;color:var(--sea)}
  .stat .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:600}

  .budget-hero{background:linear-gradient(135deg,#5e1f3d,#b5365f);color:#fff;border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;overflow:hidden}
  .budget-hero::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(47,158,110,.4),transparent 70%)}
  .budget-hero>*{position:relative}
  .budget-hero .bh-top{display:flex;justify-content:space-between;align-items:center}
  .budget-hero .bh-lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#f5d5df;font-weight:600}
  .budget-hero .bh-rate{font-size:11.5px;color:#f5d5df;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:8px;font-weight:600}
  .budget-hero .bh-clp{font-family:'Fraunces',serif;font-size:33px;font-weight:700;line-height:1.05;margin-top:7px}
  .budget-hero .bh-eur{font-size:12.5px;color:#f5d5df;margin-top:3px}
  .budget-hero .bh-pp{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;color:#fdeef3;display:flex;align-items:baseline;gap:7px}
  .budget-hero .bh-pp b{font-family:'Fraunces',serif;font-size:17px}
  .budget-hero .bh-pp .sec{color:#bfe3ec;margin-left:auto;font-size:12.5px}

  .next li{list-style:none}
  .next ul{margin:0;padding:0}
  .next li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .next li:last-child{border-bottom:0}
  .next .tag{flex:0 0 auto;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--rose);padding:3px 8px;border-radius:7px;margin-top:1px}

  /* ---------- Itinerary ---------- */
  .day{margin-bottom:14px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card)}
  .day.istoday{border:1px solid rgba(47,158,110,.55);box-shadow:0 0 0 2px rgba(47,158,110,.18),var(--shadow)}
  .day-head{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;background:linear-gradient(100deg,rgba(31,143,160,.06),transparent)}
  .day-head .date{flex:0 0 auto;text-align:center;background:var(--sea);color:#fff;border-radius:12px;padding:6px 9px;min-width:46px}
  .day.istoday .day-head .date{background:var(--orbital);color:#ffffff}
  .day-head .date .d{font-family:'Fraunces',serif;font-size:18px;font-weight:700;line-height:1}
  .day-head .date .mo{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:#bfe3ec}
  .day.istoday .day-head .date .mo{color:#ffffff}
  .day-head .ti{flex:1;min-width:0}
  .day-head .ti b{font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .day-head .ti span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
  .day-head .hicon{display:inline-flex;align-items:center;gap:4px;color:var(--aegean)}
  .day-head .chev{transition:.25s;color:var(--aegean);flex:0 0 auto}
  .day.open .chev{transform:rotate(180deg)}
  .day-body{display:none;padding:4px 15px 14px}
  .day.open .day-body{display:block}
  .slot{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
  .slot .ic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(31,143,160,.1);color:var(--aegean)}
  .slot .tx{flex:1;font-size:13.5px}
  .slot .tx b{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;font-weight:700}
  .slot .tx b.mealk{color:var(--gold)}
  .daynote{margin-top:11px;font-size:12.5px;color:var(--sea2);background:rgba(31,143,160,.07);border-left:3px solid var(--aegean);padding:9px 11px;border-radius:0 10px 10px 0}
  .badge-city{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:#fff;padding:2px 8px;border-radius:7px}
  .hotelrow{display:flex;align-items:center;gap:10px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:13px}
  .hotelrow .hi{color:var(--aegean)}
  .hotelrow .ha{margin-left:auto}

  /* ---------- Flight / hotel cards ---------- */
  .fcard{position:relative}
  .froute{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .froute .ap{font-family:'Fraunces',serif;font-size:21px;font-weight:700}
  .froute .arr{flex:1;height:1px;background:linear-gradient(90deg,var(--line),var(--aegean),var(--line));position:relative}
  .froute .arr::after{content:"✈";position:absolute;right:-2px;top:-10px;color:var(--aegean);font-size:14px}
  .froute .arr .plus{position:absolute;left:50%;top:-9px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);background:var(--card);padding:0 5px}
  .ftimes{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .ftimes b{color:var(--ink);font-size:13px}
  .fmeta{display:flex;flex-wrap:wrap;gap:7px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
  .fmeta b{color:var(--ink)}
  .hotel .hh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .hotel .hh h3{margin:0;font-size:17px}
  .hotel .stay{font-size:12.5px;color:var(--muted);margin-top:3px}
  .hotel .feat{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .feat .t{font-size:12.5px;background:rgba(94,31,61,.05);border:1px solid var(--line);padding:4px 9px;border-radius:8px;color:var(--sea2)}
  .booklink{display:inline-flex;align-items:center;gap:6px;margin-top:11px;margin-right:8px;font-size:13px;font-weight:600;background:rgba(31,143,160,.1);padding:8px 13px;border-radius:10px}

  /* ---------- Money ---------- */
  .balcard{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px}
  .balcard i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-family:'Fraunces',serif;font-size:16px;color:#3d1026;flex:0 0 auto}
  .balcard .nm{flex:1}
  .balcard .nm b{font-size:15px}
  .balcard .nm span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;max-width:32ch}
  .balcard .amt{text-align:right;font-family:'Fraunces',serif;font-weight:700;font-size:16px;white-space:nowrap}
  .amt.owe{color:var(--bad)} .amt.get{color:var(--good)}
  .transfer{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .transfer:last-child{border-bottom:0}
  .transfer .ar{color:var(--aegean);font-weight:700}
  .transfer .tamt{margin-left:auto;font-weight:700;font-family:'Fraunces',serif;color:var(--sea)}
  .bud{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .bud:last-child{border-bottom:0}
  .bud .bic{width:30px;height:30px;border-radius:9px;background:rgba(31,143,160,.1);color:var(--aegean);display:grid;place-items:center;flex:0 0 auto}
  .bud .bn{flex:1;font-size:13.5px}
  .bud .bn span{display:block;font-size:12px;color:var(--muted)}
  .bud .bv{font-weight:700;font-family:'Fraunces',serif;font-size:14.5px;white-space:nowrap}
  .total-bar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(120deg,#5e1f3d,#b5365f);color:#fff;border-radius:14px;padding:14px 17px;margin-top:6px}
  .total-bar .tt{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#f5d5df}
  .total-bar .tv{font-family:'Fraunces',serif;font-size:24px;font-weight:700}
  .total-bar small{display:block;font-size:12px;color:#bfe3ec;text-transform:none;letter-spacing:0}
  .payitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .payitem:last-child{border-bottom:0}
  .payitem .pc{flex:1}
  .payitem .pc b{font-size:13.5px}
  .payitem .pc span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .payitem .pv{text-align:right;white-space:nowrap}
  .payitem .pv b{font-family:'Fraunces',serif;font-size:14px}
  .paysum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
  .paysum .bar{height:10px;border-radius:999px;background:rgba(200,68,58,.16);overflow:hidden;margin-bottom:10px}
  .paysum .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#2fb6c4);transition:width .4s}
  .paysum .legend{display:flex;justify-content:space-between;font-size:12.5px}
  .paysum .legend .k{color:var(--muted)}
  .paysum .legend b{font-family:'Fraunces',serif;font-size:15px;display:block;margin-top:1px}
  .paysum .legend .paid b{color:var(--good)} .paysum .legend .pend b{color:var(--bad)}
  .paychk{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .paychk:last-child{border-bottom:0}
  .paychk .box{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:.15s;margin-top:1px;background:#fff}
  .paychk.done .box{background:var(--good);border-color:var(--good)}
  .paychk .box svg{opacity:0;transition:.15s}
  .paychk.done .box svg{opacity:1}
  .paychk .pc{flex:1;min-width:0}
  .paychk .pc b{font-size:13.5px}
  .paychk .pc span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .paychk .pv{text-align:right;white-space:nowrap;font-family:'Fraunces',serif;font-weight:700;font-size:14px;color:var(--bad)}
  .paychk.done .pv{color:var(--good)}
  /* quién debe a quién (simplificado) */
  .callout{display:flex;gap:11px;align-items:flex-start;background:rgba(47,158,110,.1);border:1px solid rgba(47,158,110,.32);border-radius:14px;padding:13px 15px;margin-bottom:12px;font-size:13.5px;color:var(--sea)}
  .callout .ci{color:#217a53;flex:0 0 auto;margin-top:1px}
  .settle{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:10px}
  .settle .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:'Fraunces';font-size:14px;color:#3d1026;flex:0 0 auto}
  .settle .ar{color:var(--muted);flex:0 0 auto;display:grid;place-items:center}
  .settle .slbl{flex:1;min-width:0;font-size:13.5px;margin-left:3px}
  .settle .samt{font-family:'Fraunces';font-weight:700;font-size:18px;color:var(--sea);white-space:nowrap}
  .detail{margin-top:4px}
  .detail-h{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--aegean);font-weight:600;font-size:13px;padding:6px 2px}
  .detail-h .chev{transition:.25s}
  .detail.open .detail-h .chev{transform:rotate(180deg)}
  .detail-b{display:none;margin-top:8px}
  .detail.open .detail-b{display:block}

  /* ---------- Food ---------- */
  .meal{margin-bottom:12px}
  .meal .mh{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .meal .mh .md{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--sea)}
  .meal .mh .mc{font-size:12px;color:var(--muted)}
  .meal .row{display:flex;gap:10px;padding:7px 0;font-size:13px;border-top:1px solid var(--line)}
  .meal .row .lab{flex:0 0 58px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--aegean);padding-top:2px}
  .dish{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .dish:last-child{border-bottom:0}
  .dish b{display:block;font-size:13.5px}
  .dish span{display:block;font-size:12.5px;color:var(--muted)}
  .dish .wheretoeat{display:inline-flex}
  .wheretoeat{display:inline-flex;align-items:flex-start;gap:5px;margin-top:7px;font-size:12.5px;font-weight:600;color:var(--aegean);line-height:1.35;background:rgba(31,143,160,.08);padding:6px 10px;border-radius:9px}
  .wheretoeat svg{flex:0 0 auto;margin-top:1px}

  /* ---------- Lists (check) ---------- */
  .progress{height:8px;border-radius:999px;background:rgba(94,31,61,.1);overflow:hidden;margin:6px 0 14px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--good));transition:.4s}
  .chk{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .chk:last-child{border-bottom:0}
  .chk .box{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:.15s;margin-top:1px;background:#fff}
  .chk.done .box{background:var(--good);border-color:var(--good)}
  .chk .box svg{opacity:0;transition:.15s}
  .chk.done .box svg{opacity:1}
  .chk .ct{flex:1;font-size:14px}
  .chk .ct span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .chk.done .ct b{text-decoration:line-through;color:var(--muted)}
  .chk .cat{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--aegean);background:rgba(31,143,160,.1);padding:2px 7px;border-radius:6px;flex:0 0 auto;margin-top:2px}
  .reset{display:block;margin:14px auto 0;background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:12.5px;padding:7px 16px;border-radius:999px;cursor:pointer}

  /* ---------- Info ---------- */
  .note{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .note:last-child{border-bottom:0}
  .note .ni{flex:0 0 auto;color:var(--aegean);margin-top:1px}
  .contact{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .contact:last-child{border-bottom:0}
  .contact .ci{width:38px;height:38px;border-radius:11px;background:rgba(31,143,160,.1);color:var(--aegean);display:grid;place-items:center;flex:0 0 auto}
  .contact .cd{flex:1;min-width:0}
  .contact .cd b{font-size:13.5px}
  .contact .cd span{display:block;font-size:12.5px;color:var(--muted)}
  .contact .cact{display:flex;gap:8px}
  .contact .cact a{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sea);color:#fff}
  .ferry{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .ferry:last-child{border-bottom:0}
  .ferry b{flex:1}
  .ferry .fp{font-weight:700;font-family:'Fraunces',serif;color:var(--sea)}
  .ferry .ft{font-size:12.5px;color:var(--muted)}
  .act{padding:10px 0;border-bottom:1px solid var(--line)}
  .act:last-child{border-bottom:0}
  .act b{font-size:14px}
  .act p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .climate{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .climate:last-child{border-bottom:0}
  .climate .cdot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
  .climate .cc{flex:1}
  .climate .cc b{font-size:13.5px}
  .climate .cc span{display:block;font-size:12.5px;color:var(--muted)}
  .climate .ct{font-family:'Fraunces';font-weight:700;color:var(--sea);white-space:nowrap}
  /* ruta del día (Plan) */
  .dayroute{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .dayroute .drh{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:9px}
  .dayroute .drh .hi{color:var(--aegean);display:grid;place-items:center}
  .dayroute .drh .route{margin-left:auto;margin-top:0}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .mapchip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--sea2);background:rgba(94,31,61,.05);border:1px solid var(--line);padding:6px 10px;border-radius:9px}
  .mapchip svg{color:var(--aegean);flex:0 0 auto}
  /* lugares de interés extra (Info) */
  .extra{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .extra:last-child{border-bottom:0}
  .extra .xi{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:rgba(232,163,61,.14);color:var(--gold);display:grid;place-items:center;margin-top:1px}
  .extra .xc{flex:1;min-width:0}
  .extra .xc b{font-size:14px}
  .extra .xc p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .extra .xc .mapbtn{margin-top:8px}

  /* ---------- Más hub ---------- */
  .mtile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;font-family:inherit}
  .mtile .mi{width:42px;height:42px;border-radius:12px;background:rgba(31,143,160,.1);color:var(--aegean);display:grid;place-items:center;flex:0 0 auto}
  .mtile .mt{flex:1}
  .mtile .mt b{font-size:15px;color:var(--ink)}
  .mtile .mt span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
  .mtile .arr{margin-left:auto;color:var(--muted)}

  /* ---------- Conversor ---------- */
  .conv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  .conv .seg{display:flex;gap:6px;margin-bottom:13px}
  .conv .seg button{flex:1;border:1px solid var(--line);background:#fff;font-family:inherit;font-weight:700;font-size:14px;color:var(--muted);padding:9px;border-radius:11px;cursor:pointer}
  .conv .seg button.on{background:var(--sea);color:#fff;border-color:var(--sea)}
  .conv .amt-in{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-family:'Fraunces';font-size:26px;font-weight:700;color:var(--sea);text-align:right;outline:none}
  .conv .out{margin-top:12px}
  .conv .orow{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line)}
  .conv .orow:last-child{border-bottom:0}
  .conv .orow .ol{font-size:13px;color:var(--muted);font-weight:600}
  .conv .orow .ov{font-family:'Fraunces';font-weight:700;font-size:20px;color:var(--ink)}
  .rates{font-size:12.5px;color:var(--muted)}
  .rates label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .rates label:last-child{border-bottom:0}
  .rates input{width:110px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-family:'Inter';font-size:14px;text-align:right;outline:none;color:var(--ink)}

  /* ---------- Frases ---------- */
  .phrase{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .phrase:last-child{border-bottom:0}
  .phrase .pes{flex:0 0 38%;font-size:13px;color:var(--muted)}
  .phrase .pt{flex:1}
  .phrase .pt b{font-size:14.5px}
  .phrase .pt span{display:block;font-size:12.5px;color:var(--aegean);margin-top:1px;font-style:italic}

  /* ---------- Photos / skeleton ---------- */
  img.ph{opacity:0;transition:opacity .4s ease}
  img.ph.loaded{opacity:1}
  .thumb,.rcard .cover{background:linear-gradient(100deg,rgba(94,31,61,.05),rgba(94,31,61,.11),rgba(94,31,61,.05));background-size:200% 100%;animation:shimmer 1.4s infinite linear}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.thumb,.rcard .cover{animation:none}}
  .rcard{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:12px;background:var(--card)}
  .rcard .cover{position:relative;height:130px;overflow:hidden}
  .rcard .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .rcard .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,26,32,.05) 30%,rgba(43,26,32,.78))}
  .rcard .ov{position:absolute;left:14px;bottom:10px;right:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;z-index:2}
  .rcard .ov .nm{color:#fff}
  .rcard .ov .nm .num{font-family:'Fraunces',serif;font-size:12.5px;font-weight:700;opacity:.85;letter-spacing:.04em}
  .rcard .ov .nm b{font-family:'Fraunces',serif;font-size:22px;font-weight:600;display:block;line-height:1.05;text-shadow:0 1px 8px rgba(0,0,0,.35)}
  .rcard .ov .when{color:#fff;text-align:right;font-size:12px;font-weight:600;background:rgba(0,0,0,.28);padding:4px 9px;border-radius:8px;backdrop-filter:blur(3px);white-space:nowrap}
  .rcard .desc{padding:10px 14px 13px;font-size:12.5px;color:var(--muted)}
  .thumb{flex:0 0 auto;width:74px;height:74px;border-radius:12px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .act.hasimg,.dish.hasimg{display:flex;gap:12px;align-items:flex-start}
  .act.hasimg .meta,.dish.hasimg .meta{flex:1;min-width:0}

  .sub{font-size:13.5px;color:var(--muted);margin:-4px 2px 12px;line-height:1.5}
  .falta{font-style:italic;font-weight:600;color:#a9640f;background:rgba(217,144,44,.16);
    padding:1px 7px;border-radius:6px;white-space:nowrap}
  .viajecard{background:var(--sea);color:#fff;border-radius:18px;padding:16px 17px;margin-bottom:12px;
    box-shadow:var(--shadow)}
  .viajecard.manana{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .viajecard .vh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .viajecard .vi{display:grid;place-items:center;opacity:.9}
  .viajecard .vk{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.85}
  .viajecard .vhora{margin-left:auto;font-family:'Fraunces',serif;font-size:22px;font-weight:700}
  .viajecard .vruta{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-size:19px;
    font-weight:600;margin-bottom:12px}
  .viajecard .vruta span{opacity:.6}
  .viajecard .vdatos{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
  .viajecard .vdatos>div span{display:block;font-size:11.5px;opacity:.7;letter-spacing:.03em}
  .viajecard .vdatos>div b{font-size:14.5px}
  .viajecard.manana .vdatos>div span{color:var(--muted);opacity:1}
  .viajecard .vnota{margin-top:11px;font-size:12.5px;line-height:1.45;opacity:.85}
  .viajecard .vmas{width:100%;margin-top:13px;font-family:inherit;font-size:13px;font-weight:700;padding:11px;
    border-radius:11px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
  .viajecard.manana .vmas{border-color:var(--line);background:transparent;color:var(--aegean)}
  .pendrow{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .pendrow:last-of-type{border-bottom:0}
  .pendrow .pi2{color:var(--warn);flex:0 0 auto;margin-top:1px}
  .pendrow b{font-size:14px;display:block;font-weight:600}
  .pendrow span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .daynote.sinplan{background:rgba(232,163,61,.1);border-left-color:var(--gold);font-style:italic}
  .froute .ap.busap{display:inline-flex;align-items:center;color:var(--aegean)}
  .comer{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .comer:last-child{border-bottom:0}
  .comer .cm{flex:1;min-width:0}
  .comer .cm b{font-size:14px;display:block}
  .comer .cm .ct{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
  .comer .cm .ct .pr{color:var(--gold);font-weight:700;letter-spacing:.04em}
  .comer .cm .cn{display:block;font-size:12.5px;color:var(--ink);opacity:.75;margin-top:4px}
  .comer .cmap{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:rgba(31,143,160,.1);
    color:var(--aegean);display:grid;place-items:center}
  .comergrupo.fiable{border-left:3px solid var(--good)}
  .comergrupo.porconfirmar{border-left:3px solid var(--warn)}
  .splithead{display:flex;gap:10px;margin-bottom:12px}
  .splithead .sh{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 13px;box-shadow:var(--shadow)}
  .splithead .sh .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;
    font-weight:700;font-family:'Fraunces',serif;font-size:14px;color:#fff;flex:0 0 auto}
  .splithead .sh b{font-family:'Fraunces',serif;font-size:16px;display:block;line-height:1.1}
  .splithead .sh span{font-size:12px;color:var(--muted);font-weight:600}
  .exbtn.wide{width:100%;font-family:inherit;font-size:13.5px;font-weight:700;padding:12px;border-radius:12px;
    border:1px solid var(--aegean);background:rgba(31,143,160,.08);color:var(--aegean);cursor:pointer;margin-bottom:12px}
  .exbtn.wide.compartir{margin-top:12px;border-style:dashed}
  .asigrow{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
  .asigrow:last-child{border-bottom:0}
  .asigrow.done{opacity:.55}
  .asigrow .pc{flex:1;min-width:0}
  .asigrow .pc b{font-size:13.5px;display:block}
  .asigrow .pc>span{font-size:12.5px;color:var(--muted);display:block}
  .asigrow .pv{text-align:right;font-family:'Fraunces',serif;font-weight:700;font-size:14.5px;white-space:nowrap}
  .asigrow .markpaid{display:block;margin-top:7px;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;
    padding:7px 12px;min-height:34px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  .asigrow.done .markpaid{background:rgba(47,158,110,.14);border-color:transparent;color:var(--good)}

  /* --- fix heredado: la insignia de ciudad se volvia invisible dentro de .ti --- */
  .day-head .ti .badge-city{color:#fff}

  /* --- reparto de lo pendiente --- */
  .putrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;background:var(--card);
    border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px}
  .putrow .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;
    font-weight:700;font-family:'Fraunces',serif;font-size:15px;color:#fff;flex:0 0 auto}
  .putrow .pr{flex:1;min-width:0}
  .putrow .pr b{font-size:15px}
  .putrow .pr span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
  .putrow .pamt{text-align:right;font-family:'Fraunces',serif;font-weight:700;font-size:17px;white-space:nowrap;color:var(--sea)}
  .putrow .pk{font-size:11.5px;font-weight:600;color:var(--muted);font-family:'Inter',sans-serif}
  .callout.warn{border-color:rgba(217,144,44,.45);background:rgba(217,144,44,.08)}
  .callout.warn .ci{background:rgba(217,144,44,.16);color:var(--warn)}

  /* --- gastos sobre la marcha --- */
  .expform input[type=text],.expform input[type=number]{width:100%;font-family:inherit;font-size:15px;
    padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--paper);color:var(--ink)}

  .expform .exrow input{flex:1}
  .expform .exlbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:14px 0 6px}
  .expform .seg{display:flex;gap:6px}
  .expform .seg button{flex:1;font-family:inherit;font-size:13px;font-weight:600;padding:9px 6px;border-radius:10px;
    border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;transition:.15s}
  .expform .seg button.on{background:var(--aegean);border-color:var(--aegean);color:#fff}
  .expform .seg.small{flex:0 0 auto;width:132px}
  .expform .exadd{width:100%;margin-top:15px;font-family:inherit;font-size:14.5px;font-weight:700;padding:13px;
    border:0;border-radius:12px;background:var(--sea);color:#fff;cursor:pointer}
  .exitem{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .exitem:last-child{border-bottom:0}
  .exitem .pc{flex:1;min-width:0}
  .exitem .pc b{font-size:14px;display:block}
  .exitem .pc span{font-size:12.5px;color:var(--muted)}
  .exitem .pv{font-family:'Fraunces',serif;font-weight:700;font-size:15px;white-space:nowrap;text-align:right}
  .exitem .pv .sub2{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;color:var(--muted)}
  .exitem .exdel{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0 2px;cursor:pointer}
  .exitem .exedit{border:0;background:none;color:var(--aegean);padding:0 4px;cursor:pointer;display:grid;place-items:center}
  .exitem.enedicion{background:rgba(31,143,160,.09);border-radius:10px;padding:11px 8px}

const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const cityBadge = c => `<span class="badge-city" style="background:${CITY[c].c}">${CITY[c].n}</span>`;
const eur = n => (n<0?'−':'')+eurN(Math.abs(n));
const photo = (key, alt) => `<img class="ph" loading="lazy" decoding="async" src="img/${key}.jpg" alt="${alt}" onload="this.classList.add('loaded')" onerror="this.closest('.thumb')?.remove()">`;
/* Un dato que falta no puede pintarse igual que uno confirmado. */
const FALTA = ['por confirmar','verificar','sin precio','—','-','','pendiente de confirmar'];
const dato = v => FALTA.includes(String(v||'').trim().toLowerCase())
  ? `<span class="falta">${v && String(v).trim() ? v : 'falta'}</span>` : v;
const mapsUrl = q => 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const mapBtn = (q,label) => `<a class="mapbtn" href="${mapsUrl(q)}" target="_blank" rel="noopener">${I.pin} ${label||'Ver en mapa'}</a>`;
const dirUrl = (pts, mode) => {
  if(!pts || pts.length<2) return null;
  const enc = s => encodeURIComponent(s);
  const origin=enc(pts[0].q), dest=enc(pts[pts.length-1].q);
  const mid=pts.slice(1,-1).map(p=>enc(p.q)).join('|');
  let u=`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=${mode||'walking'}`;
  if(mid) u+=`&waypoints=${mid}`;
  return u;
};
/* Las marcas del móvil (pagos, reparto, tareas, maleta) se guardaban por POSICIÓN
   en la lista. Cada vez que el Sheet gana o pierde una fila, eso desplaza lo marcado
   a otro concepto. Ahora la clave sale del texto del concepto, que no se mueve. */
function sid(txt){
  const base=(txt||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  let h=0; for(let i=0;i<(txt||'').length;i++){ h=((h<<5)-h+txt.charCodeAt(i))|0; }
  return base+'~'+(h>>>0).toString(36);
}
function loadState(key){try{return JSON.parse(localStorage.getItem(key))||{};}catch(e){return {};}}
function saveState(key,obj){localStorage.setItem(key,JSON.stringify(obj));}
const checkSVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

/* dates (with ?d=YYYY-MM-DD override for testing) */
function parseDM(dm){ const [d,m]=dm.split('/').map(Number); return new Date(2026, m-1, d); }
function todayDate(){ const p=new URLSearchParams(location.search).get('d'); const t=p?new Date(p+'T09:00:00'):new Date(); t.setHours(0,0,0,0); return t; }
function tripDayIndex(){ const tm=todayDate().getTime(); return ITIN.findIndex(d=>parseDM(d.date).getTime()===tm); }
function daysToStart(){ return Math.round((parseDM(ITIN[0].date)-todayDate())/86400000); }
const flightByDate = {}; FLIGHTS.forEach(f=>{ (flightByDate[f.date]=flightByDate[f.date]||[]).push(f); });
const hotelByName = {}; HOTELS.forEach(h=>hotelByName[h.name]=h);
const monName = mm => ['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][parseInt(mm)];

/* check counters for Hoy */
function checkCount(items,key,hasDefaults){
  const st=loadState(key); let done=0;
  items.forEach(it=>{ const id=key+'_'+sid(it.t); const c=(id in st)?st[id]:(hasDefaults?!!it.done:false); if(c)done++; });
  return {done,total:items.length,pending:items.length-done};
}
function pendingPay(){
  const st=loadState('mx_pagos'); let pend=0;
  PAYMENTS.forEach(p=>{ if(p.st!=='Pagado' && !st['mx_pagos_'+sid(p.c)]) pend+=p.val; });
  return pend;
}

/* ============== COUNTDOWN ============== */
function countdown(){
  const dep=parseDM(ITIN[0].date), now=todayDate();
  const back=parseDM(ITIN[ITIN.length-1].date);
  const diff=Math.round((dep-now)/86400000);
  const num=$('#cdNum'), lbl=$('#cdLbl'), pre=$('#cdPre');
  const setPre = t => { pre.textContent=t; pre.style.display=t?'block':'none'; };
  if(now>=dep && now<=back){ setPre(''); num.textContent='✈'; num.style.fontSize='22px'; lbl.textContent='¡en ruta!'; }
  else if(diff>0){ setPre('faltan'); num.textContent=diff; lbl.textContent=diff===1?'día':'días'; }
  else if(diff===0){ setPre(''); num.textContent='¡Hoy!'; num.style.fontSize='15px'; lbl.textContent='salida'; }
  else { setPre(''); num.textContent='♥'; lbl.textContent='vuelta'; }
}

/* ============== DINERO ============== */
/* Regla acordada con Javiera (14-sep-2026): lo pagado ANTES del viaje queda saldado,
   nadie le debe nada a nadie por eso. De aquí en adelante, todo a medias:
   - lo que queda por pagar se reparte concepto a concepto, buscando que cada uno
     ponga la mitad;
   - lo que se gasta durante el viaje va en su propia hoja y genera el saldo vivo.
   Nada de esto se calcula en el sync: se calcula aquí, con lo que haya marcado en
   el móvil, para que siga cuadrando cuando cambien las cosas sobre la marcha. */
const PAYKEY='mx_pagos', WHOKEY='mx_pagador', ASIGKEY='mx_asigna', EXPKEY='mx_gastos';
const YO=['Javiera','Juan'];
const PCOLOR={Javiera:'#1f8fa0', Juan:'#c4633a'};

let GASTO_EDIT = null;   // id del gasto que se está corrigiendo, o null
function loadExpenses(){ try{ return JSON.parse(localStorage.getItem(EXPKEY))||[]; }catch(e){ return []; } }
function saveExpenses(a){ localStorage.setItem(EXPKEY, JSON.stringify(a)); }
const eurN = v => {
  const neg = v<0; const [ent,dec] = Math.abs(v).toFixed(2).split('.');
  return (neg?'-':'') + ent.replace(/\B(?=(\d{3})+(?!\d))/g,'.') + ',' + dec + ' €';
};
const miles = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');

/* reparto automático: el concepto más caro va siempre al que menos lleva.
   Con estos importes deja una diferencia de pocos euros, que se ve en pantalla. */
function repartoAuto(items){
  /* Busca el reparto más parejo probando, para cada alojamiento, las tres opciones:
     lo paga Javiera, lo paga Juan, o lo pagan a medias. Gana la combinación con menos
     diferencia entre los dos; a igualdad, la que deja menos cosas a medias (para que
     cada uno se encargue de algo). Con muchas partidas cae al método rápido: el más
     caro siempre al que menos lleva. */
  const n=items.length;
  if(!n) return {};
  if(n>9){
    const suma={Javiera:0,Juan:0}, out={};
    [...items].sort((a,b)=>b.val-a.val).forEach(it=>{
      const quien = suma.Javiera<=suma.Juan ? 'Javiera' : 'Juan';
      out[it.k]=quien; suma[quien]+=it.val;
    });
    return out;
  }
  const OPC=['Javiera','Juan','medias'];
  let mejor=null;
  const total=Math.pow(3,n);
  for(let comb=0; comb<total; comb++){
    let c=comb, j=0, ju=0, medias=0;
    const asig=[];
    for(let k=0;k<n;k++){
      const o=OPC[c%3]; c=Math.floor(c/3); asig.push(o);
      if(o==='Javiera') j+=items[k].val;
      else if(o==='Juan') ju+=items[k].val;
      else { j+=items[k].val/2; ju+=items[k].val/2; medias++; }
    }
    const dif=Math.abs(j-ju);
    if(!mejor || dif < mejor.dif-0.005 || (Math.abs(dif-mejor.dif)<0.005 && medias<mejor.medias)){
      mejor={dif, medias, asig};
    }
  }
  const out={};
  items.forEach((it,idx)=>{ out[it.k]=mejor.asig[idx]; });
  return out;
}

function moneyState(){
  const paidSt=loadState(PAYKEY), whoSt=loadState(WHOKEY), asigSt=loadState(ASIGKEY);
  const yaEstaba = p => p.st==='Pagado';                       // pagado antes del viaje: saldado
  const isPaid = p => yaEstaba(p) || !!paidSt[PAYKEY+'_'+sid(p.c)];
  const payer  = p => whoSt[WHOKEY+'_'+sid(p.c)] || (YO.includes(p.by)?p.by:'');
  const asig   = p => asigSt[ASIGKEY+'_'+sid(p.c)] || '';

  // 1. línea base: lo ya pagado, solo informativo
  const base={Javiera:0,Juan:0}; let baseSinDueno=0, pagadoBase=0;
  // 2. lo que queda: conceptos a repartir
  const pendientes=[]; let pend=0, estimado=0;
  PAYMENTS.forEach(p=>{
    if(yaEstaba(p)){
      pagadoBase+=p.val;
      const by=payer(p);
      if(YO.includes(by)) base[by]+=p.val; else baseSinDueno+=p.val;
    } else {
      pend+=p.val;
      // solo las reservas concretas se reparten; las categorías estimadas (comida,
      // transporte, actividades...) se gastan sobre la marcha y van en Gastos
      if(p.k==='hotel'){
        pendientes.push({k:sid(p.c), c:p.c, n:p.n, val:p.val, asig:asig(p), pagado:isPaid(p), by:payer(p)});
      } else {
        estimado+=p.val;
      }
    }
  });

  // 3. dos cuentas distintas, que no se deben mezclar:
  //    owe    = lo que le corresponde de TODO lo que queda (para "le toca poner")
  //    owePag = su parte de lo que YA se ha desembolsado (para el saldo de hoy)
  const owe={Javiera:0,Juan:0}, owePag={Javiera:0,Juan:0}, put={Javiera:0,Juan:0};
  const tocaPoner={Javiera:0,Juan:0};
  const reparte=(acc,val,quien)=>{
    if(YO.includes(quien)) acc[quien]+=val;
    else { acc.Javiera+=val/2; acc.Juan+=val/2; }
  };
  pendientes.forEach(p=>{
    reparte(owe, p.val, p.asig);
    if(p.pagado){
      reparte(owePag, p.val, p.asig);
      if(YO.includes(p.by)) put[p.by]+=p.val;
    } else {
      reparte(tocaPoner, p.val, p.asig);
    }
  });

  const gastos=allGastos();
  let gastadoViaje=0;
  gastos.forEach(g=>{
    gastadoViaje+=g.eur;
    if(YO.includes(g.by)) put[g.by]+=g.eur;
    reparte(owe, g.eur, g.split);
    reparte(owePag, g.eur, g.split);
  });

  const rows=YO.map(n=>({name:n, base:base[n], owe:owe[n], put:put[n],
                         toca:tocaPoner[n], saldo:Math.round((owePag[n]-put[n])*100)/100}));
  return {isPaid, payer, asig, pendientes, pend, estimado, pagadoBase, base, baseSinDueno,
          gastos, gastadoViaje, rows, total:pagadoBase+pend+gastadoViaje};
}

/* gastos del viaje: los de la hoja (los ven los dos) + los apuntados en este móvil */
function allGastos(){
  const locales=loadExpenses().map(g=>Object.assign({}, g, {local:true}));
  const hoja=(typeof GASTOS!=='undefined'?GASTOS:[]).map(g=>Object.assign({}, g, {local:false}));
  return hoja.concat(locales);
}

function settleMoves(rows){
  const cred=rows.filter(r=>r.saldo<-0.005).map(r=>({name:r.name,amt:-r.saldo}));
  const deb =rows.filter(r=>r.saldo> 0.005).map(r=>({name:r.name,amt: r.saldo}));
  const res=[]; let i=0,j=0;
  while(i<deb.length && j<cred.length){
    const m=Math.min(deb[i].amt,cred[j].amt);
    if(m>0.005) res.push({from:deb[i].name,to:cred[j].name,amt:Math.round(m*100)/100});
    deb[i].amt-=m; cred[j].amt-=m;
    if(deb[i].amt<0.005)i++; if(cred[j].amt<0.005)j++;
  }
  return res;
}

/* ============== LISTAS ============== */
function renderCheckList(view, items, key, hasDefaults){
  const state=loadState(key);
  const wrap=el('div','card flat');
  const bar=el('div','progress'); const fill=el('i'); bar.appendChild(fill);
  const counter=el('div','sub');
  function update(){
    let done=0;
    items.forEach(it=>{ const id=key+'_'+sid(it.t); if((id in state)?state[id]:(hasDefaults?!!it.done:false)) done++; });
    const pct=Math.round(done/items.length*100); fill.style.width=pct+'%';
    counter.textContent=`${done} de ${items.length} · ${pct}%`;
  }
  items.forEach(it=>{
    const id=key+'_'+sid(it.t);
    const checked=(id in state)?state[id]:(hasDefaults?!!it.done:false);
    const row=el('div','chk'+(checked?' done':''));
    row.innerHTML=`<div class="box">${checkSVG}</div>
      <div class="ct"><b>${it.t}</b>${it.n?`<span>${it.n}</span>`:''}</div>
      <span class="cat">${it.cat}</span>`;
    row.onclick=()=>{ const now=!row.classList.contains('done'); row.classList.toggle('done',now); state[id]=now; saveState(key,state); update(); renderHoy(); };
    wrap.appendChild(row);
  });
  view.appendChild(bar); view.appendChild(counter); view.appendChild(wrap);
  const reset=el('button','reset','Reiniciar esta lista');
  reset.onclick=()=>{ if(confirm('¿Reiniciar las marcas de esta lista?')){localStorage.removeItem(key);renderListas();renderHoy();} };
  view.appendChild(reset); update();
}

/* ============== CONVERSOR ============== */
function renderConversor(){
  const v=$('#v-conversor'); v.innerHTML=backbar('mas');
  v.appendChild(el('div','sec-title','Conversor de moneda'));
  const RKEY='mx_rates';
  const rates=Object.assign({MXN:(TOTALS.rate_val||20.1)}, loadState(RKEY)); // por 1 €
  let from='MXN', amount=100;
  const conv=el('div','conv');
  conv.innerHTML=`
    <div class="seg">
      <button data-c="MXN">Peso mexicano</button><button data-c="EUR">Euro</button>
    </div>
    <input class="amt-in" type="number" inputmode="decimal" value="100">
    <div class="out"></div>`;
  v.appendChild(conv);
  const out=conv.querySelector('.out');
  const inp=conv.querySelector('.amt-in');
  const per={EUR:1, MXN:rates.MXN};
  function fmt(c,val){
    if(c==='MXN') return '$'+Math.round(val).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' MXN';
    return val.toLocaleString('es-ES',{maximumFractionDigits:2})+' €';
  }
  function calc(){
    per.MXN=rates.MXN;
    const eurVal=(amount||0)/per[from];
    const otra = from==='MXN' ? 'EUR' : 'MXN';
    out.innerHTML=`<div class="orow"><span class="ol">${otra==='EUR'?'Euro':'Peso mexicano'}</span><span class="ov">${fmt(otra,eurVal*per[otra])}</span></div>`;
  }
  conv.querySelectorAll('.seg button').forEach(b=>{
    if(b.dataset.c===from) b.classList.add('on');
    b.onclick=()=>{ from=b.dataset.c; conv.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b)); calc(); };
  });
  inp.oninput=()=>{ amount=parseFloat(inp.value); calc(); };
  calc();

  v.appendChild(el('div','sec-title','Tipos de cambio'));
  v.appendChild(el('div','sub','El de la hoja es de junio de 2026: edítalo con el real antes de viajar. Se guarda en este móvil.'));
  const rc=el('div','card rates');
  rc.innerHTML=`
    <label>1 € = <span style="margin-left:auto"></span><input id="rMXN" type="number" inputmode="decimal" value="${rates.MXN}"> $ (MXN)</label>`;
  v.appendChild(rc);
  rc.querySelector('#rMXN').oninput=e=>{
    rates.MXN=parseFloat(e.target.value)||rates.MXN; saveState(RKEY,{MXN:rates.MXN}); calc();
  };
}

/* ============== MIGRACIÓN DE LO GUARDADO ============== */
/* Si en el móvil hay marcas del esquema viejo (por posición), se traducen al nuevo
   antes de pintar nada, para no perder lo que ya estuviera marcado. */
(function migrarMarcas(){
  try{
    if(localStorage.getItem('mx_migrado_v2')) return;
    const mapas=[
      ['mx_pagos',   PAYMENTS, p=>p.c],
      ['mx_pagador', PAYMENTS, p=>p.c],
      ['mx_asigna',  PAYMENTS, p=>p.c],
      ['mx_tasks',   TASKS,    t=>t.t],
      ['mx_pack',    PACK,     t=>t.t],
    ];
    mapas.forEach(([key, lista, texto])=>{
      const st=loadState(key); let tocado=false;
      Object.keys(st).forEach(k=>{
        const m=k.match(new RegExp('^'+key+'_(\\d+)$'));
        if(!m) return;
        const i=parseInt(m[1],10);
        if(lista[i]) st[key+'_'+sid(texto(lista[i]))]=st[k];
        delete st[k]; tocado=true;
      });
      if(tocado) saveState(key,st);
    });
    localStorage.setItem('mx_migrado_v2','1');
  }catch(e){ /* si algo falla, mejor no tocar nada de lo guardado */ }
})();
